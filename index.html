<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eadb" />
  <title>Samuel & Melody — Our Story</title>
  <style>
    :root {
      --ivory: #f4ecdf;
      --gold: #b8924f;
      --ink: #171411;
      --brown: #352a23;
      --slide-duration: 10s;
      --fade-duration: 1.4s;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    body {
      background: var(--ivory);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
    }

    .slideshow {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.34), transparent 54%),
        var(--ivory);
    }

    .slideshow::before,
    .slideshow::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 10;
    }

    .slideshow::before {
      inset: 18px;
      border: 1px solid rgba(184,146,79,.72);
      box-shadow: inset 0 0 0 5px rgba(244,236,223,.7);
    }

    .slideshow::after {
      inset: 27px;
      border: 1px solid rgba(53,42,35,.16);
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0;
      transform: scale(1.008);
      transition: opacity var(--fade-duration) ease, transform var(--fade-duration) ease;
      background: transparent;
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .status {
      position: relative;
      z-index: 20;
      max-width: min(680px, calc(100vw - 72px));
      padding: 30px 36px;
      text-align: center;
      background: rgba(244,236,223,.92);
      border: 1px solid rgba(184,146,79,.6);
      box-shadow: 0 16px 50px rgba(53,42,35,.12);
    }

    .status h1 {
      margin: 0 0 10px;
      color: var(--brown);
      font-size: clamp(24px, 4vw, 44px);
      font-weight: 400;
      letter-spacing: .04em;
    }

    .status p {
      margin: 0;
      color: rgba(23,20,17,.7);
      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.7;
    }

    .status[hidden] { display: none; }

    .controls {
      position: fixed;
      right: 34px;
      bottom: 34px;
      z-index: 30;
      display: flex;
      gap: 10px;
      opacity: 0;
      transition: opacity .25s ease;
    }

    body:hover .controls,
    body:focus-within .controls { opacity: 1; }

    .control {
      appearance: none;
      border: 1px solid rgba(184,146,79,.75);
      background: rgba(244,236,223,.9);
      color: var(--brown);
      min-width: 44px;
      height: 44px;
      padding: 0 14px;
      cursor: pointer;
      font: inherit;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(53,42,35,.12);
    }

    .counter {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      z-index: 30;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(244,236,223,.78);
      color: rgba(53,42,35,.72);
      font-size: 13px;
      letter-spacing: .08em;
      opacity: 0;
      transition: opacity .25s ease;
    }

    body:hover .counter { opacity: 1; }

    .progress {
      position: fixed;
      z-index: 25;
      left: 28px;
      right: 28px;
      bottom: 27px;
      height: 2px;
      overflow: hidden;
      background: rgba(184,146,79,.16);
    }

    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--gold);
    }

    .progress.running > span {
      animation: progress var(--slide-duration) linear forwards;
    }

    @keyframes progress { from { width: 0; } to { width: 100%; } }

    @media (max-width: 640px) {
      .slideshow::before { inset: 10px; }
      .slideshow::after { inset: 16px; }
      .progress { left: 16px; right: 16px; bottom: 16px; }
      .controls { right: 20px; bottom: 24px; }
      .counter { bottom: 25px; }
    }
  </style>
</head>
<body>
  <main class="slideshow" aria-live="polite">
    <img id="slideA" class="slide active" alt="Wedding photo" />
    <img id="slideB" class="slide" alt="Wedding photo" />

    <section id="status" class="status">
      <h1>Samuel &amp; Melody</h1>
      <p id="statusText">正在讀取照片…</p>
    </section>
  </main>

  <div id="progress" class="progress" aria-hidden="true"><span></span></div>
  <div id="counter" class="counter" aria-hidden="true"></div>

  <nav class="controls" aria-label="輪播控制">
    <button id="prevBtn" class="control" type="button" aria-label="上一張">‹</button>
    <button id="pauseBtn" class="control" type="button" aria-label="暫停">Ⅱ</button>
    <button id="nextBtn" class="control" type="button" aria-label="下一張">›</button>
    <button id="fullscreenBtn" class="control" type="button">全螢幕</button>
  </nav>

  <script>
    const CONFIG = {
      owner: 'samuel8796',
      repo: 'wedding-photo-slideshow',
      branch: 'main',
      folder: 'photos',
      intervalMs: 10000,
      extensions: ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif']
    };

    const els = {
      a: document.getElementById('slideA'),
      b: document.getElementById('slideB'),
      status: document.getElementById('status'),
      statusText: document.getElementById('statusText'),
      progress: document.getElementById('progress'),
      counter: document.getElementById('counter'),
      prev: document.getElementById('prevBtn'),
      pause: document.getElementById('pauseBtn'),
      next: document.getElementById('nextBtn'),
      fullscreen: document.getElementById('fullscreenBtn')
    };

    let photos = [];
    let index = 0;
    let active = els.a;
    let inactive = els.b;
    let timer = null;
    let paused = false;

    const naturalSort = (a, b) => a.name.localeCompare(b.name, undefined, {
      numeric: true,
      sensitivity: 'base'
    });

    const isImage = file => {
      if (file.type !== 'file') return false;
      const ext = file.name.split('.').pop().toLowerCase();
      return CONFIG.extensions.includes(ext);
    };

    async function loadPhotos() {
      const api = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.folder}?ref=${CONFIG.branch}`;
      const response = await fetch(api, { headers: { Accept: 'application/vnd.github+json' } });

      if (response.status === 404) return [];
      if (!response.ok) throw new Error(`GitHub API ${response.status}`);

      const files = await response.json();
      return files.filter(isImage).sort(naturalSort).map(file => ({
        name: file.name,
        url: file.download_url
      }));
    }

    function restartProgress() {
      els.progress.classList.remove('running');
      void els.progress.offsetWidth;
      if (!paused) els.progress.classList.add('running');
    }

    function updateCounter() {
      els.counter.textContent = photos.length ? `${index + 1} / ${photos.length}` : '';
    }

    function scheduleNext() {
      clearTimeout(timer);
      if (!paused && photos.length > 1) {
        timer = setTimeout(() => show(index + 1), CONFIG.intervalMs);
      }
    }

    function preloadAround(currentIndex) {
      if (photos.length < 2) return;
      const next = new Image();
      next.src = photos[(currentIndex + 1) % photos.length].url;
    }

    function show(nextIndex, immediate = false) {
      if (!photos.length) return;
      index = (nextIndex + photos.length) % photos.length;
      const photo = photos[index];

      const swap = () => {
        inactive.classList.add('active');
        active.classList.remove('active');
        [active, inactive] = [inactive, active];
        updateCounter();
        restartProgress();
        preloadAround(index);
        scheduleNext();
      };

      inactive.onload = () => {
        inactive.onload = null;
        if (immediate) {
          active.classList.remove('active');
          inactive.classList.add('active');
          [active, inactive] = [inactive, active];
          updateCounter();
          restartProgress();
          preloadAround(index);
          scheduleNext();
        } else {
          swap();
        }
      };

      inactive.onerror = () => {
        inactive.onload = null;
        inactive.onerror = null;
        if (photos.length > 1) show(index + 1);
      };

      inactive.src = photo.url;
      inactive.alt = photo.name;
    }

    function setPaused(value) {
      paused = value;
      els.pause.textContent = paused ? '▶' : 'Ⅱ';
      els.pause.setAttribute('aria-label', paused ? '播放' : '暫停');
      clearTimeout(timer);
      els.progress.classList.remove('running');
      if (!paused) {
        restartProgress();
        scheduleNext();
      }
    }

    els.prev.addEventListener('click', () => show(index - 1));
    els.next.addEventListener('click', () => show(index + 1));
    els.pause.addEventListener('click', () => setPaused(!paused));

    els.fullscreen.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') show(index - 1);
      if (event.key === 'ArrowRight') show(index + 1);
      if (event.key === ' ') {
        event.preventDefault();
        setPaused(!paused);
      }
      if (event.key.toLowerCase() === 'f') els.fullscreen.click();
    });

    (async () => {
      try {
        photos = await loadPhotos();
        if (!photos.length) {
          els.statusText.textContent = '請把 JPG、PNG、WEBP、GIF 或 AVIF 照片放進 photos 資料夾。';
          return;
        }

        els.status.hidden = true;
        show(0, true);
      } catch (error) {
        console.error(error);
        els.statusText.textContent = '照片讀取失敗，請稍後重新整理頁面。';
      }
    })();
  </script>
</body>
</html>
